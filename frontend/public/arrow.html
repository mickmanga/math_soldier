<style>

/* Conteneur principal de la flèche */
.location-arrow {
  position: relative;
  width: 60px;
  height: 60px;
  background-color: blue;
  clip-path: polygon(50% 0%, 100% 100%, 50% 80%, 0% 100%);
  transform: rotate(90deg); /* Pour pointer vers le haut par défaut */
}
