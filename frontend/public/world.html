<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map avec cercles</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .map-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .circle {
            width: 50px;
            height: 50px;
            background-color: #3498db;
            border-radius: 50%;
            position: relative;
            margin: 20px 0;
        }

        .line-vertical {
            width: 4px;
            height: 40px;
            background-color: #000;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
        }

        .line-horizontal {
            width: 50px;
            height: 4px;
            background-color: #000;
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translateY(-50%);
        }

        .info-box {
            width: 100px;
            height: 50px;
            background-color: #2ecc71;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 20px;
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translateY(-50%);
            font-size: 14px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="map-container">
        <div class="circle">
            <div class="line-horizontal"></div>
            <div class="info-box">Gardien</div>
            <div class="line-vertical"></div>
        </div>
        <div class="circle">
            <div class="line-horizontal"></div>
            <div class="info-box">Challenge</div>
            <div class="line-vertical"></div>
        </div>
        <div class="circle">
            <div class="line-horizontal"></div>
            <div class="info-box">Gardien</div>
        </div>
    </div>
</body>
</html>
