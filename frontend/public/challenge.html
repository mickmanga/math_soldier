              <h1>1. Les Fonctions : Comprendre les Relations Mathématiques</h1>

              <h2>1.1 Qu'est-ce qu'une Fonction ?</h2>
              <p>
                Une <strong>fonction</strong> est une relation qui associe à chaque valeur d'entrée
                (appelée variable indépendante) une seule valeur de sortie (appelée variable dépendante).
                Pensez à une fonction comme une machine qui prend un ingrédient (l'entrée) et produit un produit (la sortie).
              </p>
              <h3>Exemple :</h3>
              <ul>
                <li>Si on entre 3, la machine sort 5.</li>
                <li>Si on entre 7, la machine sort 9.</li>
              </ul>
              <h3>Mathématiquement :</h3>
              <ul>
                <li>\(f(3) = 3 + 2 = 5\)</li>
                <li>\(f(7) = 7 + 2 = 9\)</li>
              </ul>
            
              <h2>1.2 Notation et Représentation des Fonctions</h2>
              <ul>
                <li><strong>Notation fonctionnelle :</strong> \(f(x)\) signifie la fonction \(f\) évaluée en \(x\).</li>
                <li><strong>Variable indépendante :</strong> \(x\) (l'entrée).</li>
                <li><strong>Variable dépendante :</strong> \(y = f(x)\) (la sortie).</li>
              </ul>
              <p>Les fonctions peuvent être représentées graphiquement en traçant des points \((x, y)\) sur un plan cartésien. Cela permet de visualiser comment la fonction se comporte.</p>
            
              <h2>1.3 Types de Fonctions Courantes</h2>
              <p>Les fonctions sont des outils fondamentaux en mathématiques, et il existe plusieurs types de fonctions qui apparaissent fréquemment. Comprendre ces fonctions et leurs caractéristiques est essentiel pour progresser en calcul.</p>
            
              <h3>1.3.1 Fonctions Linéaires</h3>
              <p><strong>Définition :</strong> Une fonction linéaire est une fonction de la forme :</p>
              <p>\(f(x) = mx + b\)</p>
              <ul>
                <li>\(m\) est le <strong>coefficient directeur</strong> ou pente de la droite.</li>
                <li>\(b\) est l'<strong>ordonnée à l'origine</strong>, c'est-à-dire le point où la droite coupe l'axe des ordonnées (\(y\)).</li>
              </ul>
              <h3>Caractéristiques :</h3>
              <ul>
                <li>Le graphique d'une fonction linéaire est une droite.</li>
                <li>Si \(m > 0\), la droite est croissante (monte de la gauche vers la droite).</li>
                <li>Si \(m < 0\), la droite est décroissante (descend de la gauche vers la droite).</li>
                <li>Si \(m = 0\), la fonction est constante et la droite est horizontale.</li>
              </ul>
            
              <h3>1.3.2 Fonctions Quadratiques</h3>
              <p><strong>Définition :</strong> Une fonction quadratique est une fonction de la forme :</p>
              <p>\(f(x) = ax^2 + bx + c\)</p>
              <ul>
                <li>\(a, b,\) et \(c\) sont des constantes réelles.</li>
                <li>\(a \neq 0\) pour assurer que le terme en \(x^2\) est présent.</li>
              </ul>
              <h3>Caractéristiques :</h3>
              <ul>
                <li>Le graphique d'une fonction quadratique est une parabole.</li>
                <li>Si \(a > 0\), la parabole s'ouvre vers le haut.</li>
                <li>Si \(a < 0\), la parabole s'ouvre vers le bas.</li>
                <li>Le sommet de la parabole est le point où la fonction atteint son maximum ou minimum.</li>
              </ul>
            
              <h3>1.3.3 Fonctions Exponentielles</h3>
              <p><strong>Définition :</strong> Une fonction exponentielle est une fonction de la forme :</p>
              <p>\(f(x) = a^x\)</p>
              <ul>
                <li>\(a\) est une constante positive différente de 1 (\(a > 0\) et \(a \neq 1\)).</li>
                <li>La variable \(x\) est à l'exposant.</li>
              </ul>
              <h3>Caractéristiques :</h3>
              <ul>
                <li>Si \(a > 1\), la fonction est croissante.</li>
                <li>Si \(0 < a < 1\), la fonction est décroissante.</li>
                <li>Le graphique passe toujours par le point \((0, 1)\) puisque \(a^0 = 1\).</li>
              </ul>
            
              <h3>1.3.4 Fonctions Logarithmiques</h3>
              <p><strong>Définition :</strong> Une fonction logarithmique est la fonction inverse d'une fonction exponentielle, de la forme :</p>
              <p>\(f(x) = \log_a x\)</p>
              <ul>
                <li>\(a\) est la base du logarithme (\(a > 0\) et \(a \neq 1\)).</li>
                <li>La fonction est définie pour \(x > 0\).</li>
              </ul>
              <h3>Caractéristiques :</h3>
              <ul>
                <li>Si \(a > 1\), la fonction est croissante.</li>
                <li>Si \(0 < a < 1\), la fonction est décroissante.</li>
                <li>Le graphique passe par le point \((1, 0)\) puisque \(\log_a 1 = 0\).</li>
              </ul>
              
              <h1>1.3 Types de Fonctions Courantes (Suite)</h1>

              <h2>1.3.5 Fonctions Trigonométriques</h2>
              <p><strong>Définition :</strong> Les fonctions trigonométriques sont liées aux angles et aux triangles, notamment dans le cercle unité.</p>
              <p>Les principales fonctions sont :</p>
              <ul>
                <li><strong>Sinus :</strong> \(f(x) = \sin x\)</li>
                <li><strong>Cosinus :</strong> \(f(x) = \cos x\)</li>
                <li><strong>Tangente :</strong> \(f(x) = \tan x\)</li>
              </ul>
              <p><strong>Caractéristiques :</strong></p>
              <ul>
                <li><strong>Périodicité :</strong> Les fonctions sinus et cosinus sont périodiques de période \(2\pi\).</li>
                <li><strong>Amplitude :</strong> Les valeurs de \(\sin x\) et \(\cos x\) sont comprises entre \(-1\) et \(1\).</li>
                <li><strong>Points remarquables :</strong></li>
                <ul>
                  <li>\(\sin 0 = 0, \sin \frac{\pi}{2} = 1\)</li>
                  <li>\(\cos 0 = 1, \cos \frac{\pi}{2} = 0\)</li>
                </ul>
              </ul>
            
              <h2>1.3.6 Fonctions Réciproques</h2>
              <p><strong>Définition :</strong> Une fonction réciproque est une fonction qui "annule" l'effet d'une autre fonction. Si \(f\) est une fonction bijective, alors sa réciproque \(f^{-1}\) est définie par :</p>
              <p>\(f^{-1}(f(x)) = x\)</p>
              <p><strong>Exemples :</strong></p>
              <ul>
                <li>La fonction exponentielle \(f(x) = e^x\) a pour réciproque la fonction logarithme naturel \(f^{-1}(x) = \ln x\).</li>
                <li>La fonction carré \(f(x) = x^2\) (pour \(x \geq 0\)) a pour réciproque la fonction racine carrée \(f^{-1}(x) = \sqrt{x}\).</li>
              </ul>
            
              <h2>1.3.7 Fonctions Absolues</h2>
              <p><strong>Définition :</strong> La fonction valeur absolue est définie par :</p>
              <p>\(f(x) = |x| = \begin{cases} x, & \text{si } x \geq 0 \\ -x, & \text{si } x < 0 \end{cases}\)</p>
              <p><strong>Caractéristiques :</strong></p>
              <ul>
                <li>Le graphique est en forme de "V", avec un minimum à \(x = 0\).</li>
                <li>La fonction est toujours <strong>positive</strong> ou nulle.</li>
                <li>Elle est <strong>continue</strong> sur \(\mathbb{R}\).</li>
              </ul>
              <p><strong>Exemples :</strong></p>
              <ul>
                <li>\(f(-3) = |-3| = 3\)</li>
                <li>\(f(2) = |2| = 2\)</li>
                <li>\(f(0) = |0| = 0\)</li>
              </ul>
            
              <h2>1.3.8 Fonctions Racines</h2>
              <p><strong>Définition :</strong> Une fonction racine est une fonction qui associe à un nombre son radical (racine).</p>
              <p><strong>Exemple :</strong></p>
              <ul>
                <li><strong>Racine carrée :</strong> \(f(x) = \sqrt{x}\), définie pour \(x \geq 0\).</li>
                <li><strong>Racine cubique :</strong> \(f(x) = \sqrt[3]{x}\), définie pour tout \(x\).</li>
              </ul>
              <p><strong>Caractéristiques :</strong></p>
              <ul>
                <li><strong>Racine carrée :</strong> Le graphique est une courbe qui commence à \(x = 0\) et augmente lentement.</li>
                <li><strong>Racine cubique :</strong> Le graphique passe par l'origine et est symétrique par rapport à l'origine.</li>
              </ul>
            
              <h2>1.3.9 Fonctions Rationnelles</h2>
              <p><strong>Définition :</strong> Une fonction rationnelle est le quotient de deux polynômes :</p>
              <p>\(f(x) = \frac{P(x)}{Q(x)}\)</p>
              <ul>
                <li>\(P(x)\) et \(Q(x)\) sont des polynômes.</li>
                <li>La fonction n'est pas définie là où \(Q(x) = 0\).</li>
              </ul>
              <p><strong>Caractéristiques :</strong></p>
              <ul>
                <li><strong>Asymptotes verticales :</strong> Là où \(Q(x) = 0\).</li>
                <li><strong>Asymptotes horizontales ou obliques :</strong> Déterminées par les degrés de \(P(x)\) et \(Q(x)\).</li>
              </ul>
              <p><strong>Exemple :</strong></p>
